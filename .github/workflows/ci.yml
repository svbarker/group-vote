name: CI

# Run the quality gate on every PR and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node so its cache can find the pnpm store.
      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck (app + convex) + lint + test. No Convex deployment needed:
      # component tests mock the client and convex-test runs in-memory.
      - run: pnpm check
